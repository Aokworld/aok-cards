<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A²OK — Create your Kindness Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--gold:#9A7B29;--gold-l:#C9B681;--dark:#1F2937;--grey:#6B7280;--cream:#FAF6EC;--paper:#FFFFFF;--line:#E4D9BE;--soft:#F3ECDA;--maroon:#5a1414;--ink:#2A1B0E;--field:#5B4A33;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--cream);color:var(--dark);font-family:'Crimson Pro',Georgia,serif;font-size:16px;line-height:1.5;}
  .top{max-width:1240px;margin:0 auto;padding:26px 26px 6px;}
  .eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
  h1{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;margin:.15rem 0;}
  .lede{color:var(--grey);font-style:italic;font-size:16px;border-bottom:2px solid var(--gold-l);padding-bottom:14px;}
  .grid{max-width:1240px;margin:0 auto;padding:18px 26px 46px;display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
  @media(max-width:940px){.grid{grid-template-columns:1fr;}.card-col{position:static!important;}}
</style>
</head>
<body>
PUSH_PLACEHOLDER_WILL_BE_REPLACED_BELOW
</body></html>
